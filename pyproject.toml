[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rop-classification"
version = "0.1.0"
description = "Retinopathy of Prematurity (ROP) classification system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "numpy",
    "opencv-python",
    "Pillow",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "tqdm",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "flake8",
    "black"
]
